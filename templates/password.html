{{define "konten"}}
<div class="title-row"><div><h1>Ganti password</h1>
  <p class="sub">Akun {{.Sesi.Username}} · setelah diganti, sesi di perangkat lain otomatis keluar.</p></div></div>
<form class="panel" method="post" action="/password" style="max-width:420px">
  <input type="hidden" name="csrf" value="{{.Sesi.CSRF}}">
  <div class="field"><label for="lama">Password lama</label>
    <input id="lama" name="lama" type="password" class="input{{if index .Errors "lama"}} invalid{{end}}" autocomplete="current-password" required>
    {{with index .Errors "lama"}}<p class="field-error" role="alert">{{.}}</p>{{end}}</div>
  <div class="field"><label for="baru">Password baru</label>
    <input id="baru" name="baru" type="password" class="input{{if index .Errors "baru"}} invalid{{end}}" autocomplete="new-password" minlength="8" maxlength="72" required>
    {{with index .Errors "baru"}}<p class="field-error" role="alert">{{.}}</p>{{else}}<p class="sub">Minimal 8 karakter.</p>{{end}}</div>
  <div class="field"><label for="ulang">Ulangi password baru</label>
    <input id="ulang" name="ulang" type="password" class="input{{if index .Errors "ulang"}} invalid{{end}}" autocomplete="new-password" required>
    {{with index .Errors "ulang"}}<p class="field-error" role="alert">{{.}}</p>{{end}}</div>
  <div class="actions"><button class="btn">Simpan password</button></div>
</form>
{{end}}
