{{define "layout"}}<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Judul}} · SeduhPoint</title>
  <link rel="icon" href="/static/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
{{if .Sesi.Username}}
  <div class="app">
    {{template "sidebar" .}}
    <main class="main">
      {{if .Flash}}<div class="alert ok" role="status">{{.Flash}}</div>{{end}}
      {{if .Error}}<div class="alert bad" role="alert">{{.Error}}</div>{{end}}
      {{template "konten" .}}
    </main>
  </div>
{{else}}
  {{template "konten" .}}
{{end}}
  {{template "footer" .}}
</body>
</html>{{end}}
