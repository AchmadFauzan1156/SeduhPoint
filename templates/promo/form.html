{{define "konten"}}
<h1 class="h4">Form Promo</h1>
<!-- TODO M2: field tampil sesuai jenis (bisa disembunyikan/ditampilkan via static/js/app.js) -->
<form method="post" action="/promo" style="max-width:640px">
  <input class="form-control mb-2" name="nama" placeholder="Nama promo">
  <select class="form-select mb-2" name="jenis" id="jenis">
    <option value="DISKON_PERSEN">Diskon persen produk</option>
    <option value="MIN_BELANJA">Potongan minimal belanja</option>
    <option value="B2G1">Beli 2 gratis 1 (kategori)</option>
    <option value="VOUCHER">Voucher berkode</option>
  </select>
  <div data-jenis="DISKON_PERSEN"><input class="form-control mb-2" name="nilai_persen" type="number" min="1" max="100" placeholder="Persen (%)"><!-- checkbox produk target --></div>
  <div data-jenis="MIN_BELANJA"><input class="form-control mb-2" name="min_belanja" type="number" placeholder="Minimal belanja"></div>
  <div data-jenis="MIN_BELANJA VOUCHER"><input class="form-control mb-2" name="nilai_nominal" type="number" placeholder="Nominal potongan"></div>
  <div data-jenis="B2G1"><!-- checkbox kategori target --></div>
  <div data-jenis="VOUCHER"><input class="form-control mb-2" name="kode_voucher" placeholder="Kode voucher"><input class="form-control mb-2" name="kuota" type="number" min="1" placeholder="Kuota"></div>
  <div class="row g-2 mb-2">
    <div class="col"><label class="form-label small">Tanggal mulai</label><input class="form-control" type="date" name="tgl_mulai"></div>
    <div class="col"><label class="form-label small">Tanggal selesai</label><input class="form-control" type="date" name="tgl_selesai"></div>
    <div class="col"><label class="form-label small">Jam mulai (opsional)</label><input class="form-control" type="time" name="jam_mulai"></div>
    <div class="col"><label class="form-label small">Jam selesai</label><input class="form-control" type="time" name="jam_selesai"></div>
  </div>
  <!-- checkbox cabang berlaku -->
  <button class="btn btn-coffee">Simpan</button>
</form>
{{end}}
